name: Multi-Platform CI/CD (Android & Web)

on:
  push:
    branches: [ main, master ] 
  workflow_dispatch:
    inputs:
      dist_type:
        description: 'Choose distribution type'
        required: true
        default: 'tester'
        type: choice
        options:
          - tester
          - shorebird_patch
          - shorebird_release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs: 
  # Android Job
  android_distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      - name: Restore Keystore File
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > new-release-key.jks

      - name: Restore Firebase Config
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/core/services/firebase/firebase_options.dart

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../new-release-key.jks" >> android/key.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Set up Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: android

      - name: Install Bundler and Gems
        working-directory: android
        run: |
          gem install bundler
          bundle install

      - name: Build and Distribute Android
        working-directory: android
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
        run: |
          DIST_TYPE="${{ github.event.inputs.dist_type }}"
          CURRENT_BRANCH="${{ github.ref }}"
          
          # الافتراضي عند الـ push هو tester
          if [ -z "$DIST_TYPE" ]; then
            DIST_TYPE="tester"
          fi
          
          # التحقق من البرانش قبل عمليات Shorebird
          if [[ "$DIST_TYPE" == "shorebird_patch" || "$DIST_TYPE" == "shorebird_release" ]]; then
            if [[ "$CURRENT_BRANCH" != "refs/heads/main" && "$CURRENT_BRANCH" != "refs/heads/master" ]]; then
              echo "Error: Shorebird operations are only allowed on main or master branches. Current branch is $CURRENT_BRANCH"
              exit 1
            fi
          fi
          
          if [ "$DIST_TYPE" == "tester" ]; then
            bundle exec fastlane distribute
          elif [ "$DIST_TYPE" == "shorebird_patch" ]; then
            bundle exec fastlane shorebird_patch
          elif [ "$DIST_TYPE" == "shorebird_release" ]; then
            bundle exec fastlane shorebird_release
          fi

  # Web Job
  web_deploy:
    # يعمل فقط على main أو master
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Firebase Options (Web)
        run: |
          mkdir -p lib/core/services/firebase
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/core/services/firebase/firebase_options.dart

      - name: Build Web
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons --dart-define=ADMIN_PIN=${{ secrets.ADMIN_PIN }}

      - name: Copy Vercel Config
        run: cp vercel.json build/web/

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          vercel-version: latest
          working-directory: ./build/web
