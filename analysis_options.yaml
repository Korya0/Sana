
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    todo: ignore
    missing_required_param: error
    missing_return: error
    unused_import: error
    unused_local_variable: warning
    dead_code: error
    # Shorebird-safe: avoid breaking changes in generated code
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "**/generated/**"
    - "lib/core/constants/generated/**"
    - "lib/core/networking/firebase/**"

linter:
  rules:
    # ✅ Architecture & Design
    always_declare_return_types: true
    type_annotate_public_apis: true
    avoid_dynamic_calls: true

    # ✅ Safety & Correctness
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    unawaited_futures: true

    # ✅ Code Quality
    prefer_final_fields: true
    prefer_final_locals: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_interpolation_to_compose_strings: true
    avoid_redundant_argument_values: true
    cascade_invocations: true

    # ✅ Ordering & Style
    sort_constructors_first: true
    sort_unnamed_constructors_first: true
    sort_pub_dependencies: false  # Managed manually for readability
    directives_ordering: false    # ❌ Opt-out: إيقاف الإجبار على ترتيب الـ imports أبجدياً

    # ✅ Documentation
    comment_references: true

    # ❌ Opt-out — not practical for Flutter/Islamic app
    public_member_api_docs: false      # Too strict for widget-heavy UI code
    lines_longer_than_80_chars: false  # Impractical in Flutter (long widget trees & Arabic strings)
    one_member_abstracts: false        # Abstract interfaces serve DIP even with one method
    eol_at_end_of_file: false
