name: sana
description: "Sana (سنا) - A premium Islamic companion application built with Flutter."
publish_to: "none"

version: 1.1.0+5

environment:
  sdk: ^3.8.1

# ==============================================================================
# DEPENDENCIES (Production)
# Last updated: 2026-03-13 | Strategy: Always use latest stable for Play/App Store
# ==============================================================================
dependencies:
  # --- Core SDK & Localization ---
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Architecture & Navigation ---
  go_router: ^17.1.0

  # --- State Management & DI ---
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1

  # --- Networking & Backend (Firebase) ---
  dio: ^5.9.2
  retrofit: ^4.9.2
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.3
  firebase_crashlytics: ^5.0.8
  firebase_performance: ^0.11.1+5
  firebase_remote_config: ^6.1.4
  cloud_firestore: ^6.1.3

  # --- Local Storage ---
  hive_flutter: ^1.1.0

  # --- Islamic Logic & Features ---
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  quran_library: ^4.2.0

  # --- Location & Sensors ---
  flutter_compass: ^0.8.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2

  # --- Device Info & Permissions ---
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  permission_handler: ^12.0.1

  # --- Notifications & Background Tasks ---
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.9.0+3

  # --- UI, Design & Animations ---
  flutter_animate: ^4.5.2
  carousel_slider: ^5.1.1
  flutter_islamic_icons: ^1.0.2
  flutter_svg: ^2.2.2
  flutter_widget_from_html: ^0.17.1
  skeletonizer: ^2.1.1
  solar_icons: ^0.1.0
  cupertino_icons: ^1.0.8
  toastification: ^3.0.3

  # --- Utilities & Helpers ---
  html: ^0.15.6
  intl: ^0.20.2
  logger: ^2.6.2
  pretty_dio_logger: ^1.4.0
  screenshot: ^3.0.0
  share_plus: ^13.1.0
  url_launcher: ^6.3.1

  # --- Development Tools (Runtime) ---
  device_preview: ^1.2.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_dotenv: ^6.0.1
  collection: ^1.19.1
  crypto: ^3.0.7

# ==============================================================================
# DEV DEPENDENCIES (Build & Analysis Only)
# ==============================================================================
dev_dependencies:

  # --- Code Generation ---
  build_runner: ^2.4.12
  retrofit_generator: ^10.2.6
  very_good_analysis: ^10.2.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

# ==============================================================================
# FLUTTER CONFIGURATION
# ==============================================================================
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/
    - assets/audio/
    - assets/svgs/
    - shorebird.yaml

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700

    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran/AmiriQuran-Regular.ttf
          weight: 400
