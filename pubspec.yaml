name: sana
description: "Sana - A Flutter project for Islamic content."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  go_router: ^17.0.0
  get_it: ^9.1.0
  flutter_svg: ^2.2.2
  device_preview: ^1.3.1
  flutter_bloc: ^9.1.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  dartz: ^0.10.1
  logger: ^2.6.2
  skeletonizer: ^2.1.0+1
  lottie: ^3.3.1
  equatable: ^2.0.7
  animate_do: ^4.2.0
  geolocator: ^14.0.2
  carousel_slider: ^5.1.1
  solar_icons: ^0.0.5
  flutter_islamic_icons: ^1.0.2
  share_plus: ^12.0.1
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  geocoding: ^4.0.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  vibration: ^3.1.4
  flutter_compass: ^0.8.0
  flutter_local_notifications: ^19.5.0
  workmanager: ^0.9.0+3
  permission_handler: ^12.0.1
  timezone: ^0.10.1
  toastification: ^3.0.3
  font_awesome_flutter: ^10.8.0
  package_info_plus: ^8.1.2
  screenshot: ^3.0.0
  device_info_plus: ^12.3.0
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  quran_library: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/audio/
    - assets/json/
    - shorebird.yaml
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900

    - family: UthmanTaha
      fonts:
        - asset: assets/fonts/uthman/UthmanTN1-Ver10.otf
        
