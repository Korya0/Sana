name: sana
description: "Sana - A Flutter project for Islamic content."
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.8.1

dependencies:
  adhan: ^2.0.0+1
  animate_do: ^4.2.0
  carousel_slider: ^5.1.1
  cloud_firestore: ^6.1.2
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  device_info_plus: ^12.3.0
  device_preview: ^1.3.1
  dio: ^5.4.0
  equatable: ^2.0.7
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7
  firebase_remote_config: ^6.1.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_compass: ^0.8.0
  flutter_islamic_icons: ^1.0.2
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.2.2
  flutter_widget_from_html: ^0.17.1
  font_awesome_flutter: ^10.12.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get_it: ^9.1.0
  go_router: ^17.0.0
  hijri: ^3.0.0
  html: ^0.15.6
  intl: ^0.20.2
  logger: ^2.6.2
  lottie: ^3.3.1
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pretty_dio_logger: ^1.4.0
  quran_library: ^2.3.1
  screenshot: ^3.0.0
  sentry_flutter: ^9.14.0
  share_plus: ^12.0.1
  shared_preferences: ^2.2.2
  skeletonizer: ^2.1.0+1
  solar_icons: ^0.0.5
  timezone: ^0.10.1
  toastification: ^3.0.3
  url_launcher: ^6.3.1
  vibration: ^3.1.4
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/json/
    - assets/audio/
    - shorebird.yaml
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900

    - family: UthmanTaha
      fonts:
        - asset: assets/fonts/uthman/UthmanTN1-Ver10.otf
