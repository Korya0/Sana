name: sana
description: "Sana (سَـنَـا) - A premium Islamic companion application built with Flutter."
publish_to: "none"

version: 1.1.0+5

environment:
  sdk: ^3.8.1

# ==============================================================================
# DEPENDENCIES (Production)
# Last updated: 2026-03-13 | Strategy: Always use latest stable for Play/App Store
# ==============================================================================
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  flutter_animate: ^4.5.2
  device_preview: ^1.2.0
  firebase_core: ^4.5.0
  hive_flutter: ^1.1.0
  flutter_svg: ^2.0.17
  solar_icons_flutter: ^1.0.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

# ASSETS
  assets:
    - assets/svgs/
    - shorebird.yaml

  fonts:
    - family: Cairo
      fonts:
        - asset: "assets/fonts/cairo/Cairo-VariableFont_slnt,wght.ttf"

    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran/AmiriQuran-Regular.ttf
          weight: 400

# ==============================================================================
# APP ICON & NATIVE SPLASH GENERATORS
# (merged from flutter_launcher_icons.yaml and flutter_native_splash.yaml)
# Run: dart run flutter_launcher_icons  |  dart run flutter_native_splash:create
# ==============================================================================
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/native/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  remove_alpha_ios: true
  image_path: "assets/native/app_icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/native/splash.png"
  color_dark: "#000000"
  image_dark: "assets/native/splash.png"
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: "assets/native/splash.png"
    icon_background_color: "#ffffff"
    image_dark: "assets/native/splash.png"
    icon_background_color_dark: "#000000"
