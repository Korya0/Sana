name: sana
description: "Sana (سَـنَـا) - A premium Islamic companion application built with Flutter."
publish_to: "none"

version: 1.1.0+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Routing
  go_router: ^18.1.0

  # State
  flutter_bloc: ^9.1.1

  # Injection
  get_it: ^9.2.1

  # Motion
  flutter_animate: ^4.5.2

  # Preview
  device_preview: ^1.2.0

  # Firebase
  firebase_core: ^4.5.0

  # Storage
  hive_flutter: ^1.1.0

  # Graphics
  flutter_svg: ^2.0.17

  # Icons
  solar_icons_flutter: ^1.0.0
  flutter_islamic_icons: ^1.0.2
  cupertino_icons: ^1.0.8

  # Skeleton
  skeletonizer: ^2.1.1

  # Toast
  toastification: ^3.0.3

  # Location
  geolocator: ^13.0.2

  # Sensors
  sensors_plus: ^6.1.1

  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  # Linting
  flutter_lints: ^6.0.0

  # Testing
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Branding
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/json/azkar/
    - assets/svgs/
    - shorebird.yaml

  # Fonts
  fonts:
    - family: Cairo
      fonts:
        - asset: "assets/fonts/cairo/Cairo-VariableFont_slnt,wght.ttf"

    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran/AmiriQuran-Regular.ttf
          weight: 400

# App icon
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/native/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  remove_alpha_ios: true
  image_path: "assets/native/app_icon.png"

# Native splash
flutter_native_splash:
  color: "#ffffff"
  image: "assets/native/splash.png"
  color_dark: "#000000"
  image_dark: "assets/native/splash.png"
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: "assets/native/splash.png"
    icon_background_color: "#ffffff"
    image_dark: "assets/native/splash.png"
    icon_background_color_dark: "#000000"
