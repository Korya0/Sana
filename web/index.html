<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="تطبيق سَـنَـا - تطبيق إسلامي شامل للأذكار ومواقيت الصلاة"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="سَـنَـا" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>سَـنَـا</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        background-color: #000000;
        margin: 0;
        padding: 0;
      }

      /* Splash Screen Styles */
      #splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #splash img {
        width: 120px;
        height: 120px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      #splash .loading-text {
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 18px;
        margin-top: 24px;
        opacity: 0.8;
      }

      #splash .loading-dots {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      #splash .loading-dots span {
        width: 10px;
        height: 10px;
        background-color: #ffffff;
        border-radius: 50%;
        animation: bounce 1.4s ease-in-out infinite both;
      }

      #splash .loading-dots span:nth-child(1) {
        animation-delay: -0.32s;
      }
      #splash .loading-dots span:nth-child(2) {
        animation-delay: -0.16s;
      }
      #splash .loading-dots span:nth-child(3) {
        animation-delay: 0s;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.8;
        }
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash">
      <img src="assets/assets/svgs/logo.svg" alt="سَـنَـا" />
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <script src="flutter_bootstrap.js" async></script>
    <script>
      // Hide splash when Flutter is ready
      window.addEventListener("flutter-first-frame", function () {
        var splash = document.getElementById("splash");
        if (splash) {
          splash.classList.add("hidden");
          setTimeout(function () {
            splash.remove();
          }, 300);
        }
      });
    </script>
  </body>
</html>
